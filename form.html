
        <form class="Communication" action="#" method="post">
            <h2>Обратная связь</h2>
            <div class="form-group">
                <label for="name">Имя</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Введите ваше имя"
                    required
                    minlength="2"
                    maxlength="50">
                <span class="error-message">Введите имя (от 2 до 50 символов)</span>
            </div>
            <div class="form-group">
                <label for="email">Почта</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Введите вашу почту"
                    required
                    minlength="8"
                    maxlength="50">
                <span class="error-message">Введите вашу почту (от 8 до 50 символов)</span>
            </div>
            <div class="form-group">
                <label for="message">Сообщение</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Введите сообщение"
                    required
                    minlength="10"
                    maxlength="300"></textarea>
                <span class="error-message">Введите ваше сообщение (от 10 до 300 символов)</span>
            </div>
            <button type="submit" class="btn">Отправить</button>
        </form>
